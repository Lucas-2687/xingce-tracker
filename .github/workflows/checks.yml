name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out all branch and tag history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test privacy scanner
        run: node --test scripts/privacy-check.test.mjs
      - name: Check worktree, index and reachable history
        run: npm run privacy:check -- --history
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test HTTP authentication and persistence
        run: npm run test:http -- --production
